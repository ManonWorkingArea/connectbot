name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed OSS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with termlib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 cmake;3.22.1'

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/selfuse.jks"

      - name: Assemble OSS debug APK (self-use key)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleOssDebug \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/selfuse.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify APK signature (must be the self-use key)
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/oss/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          grep -q "963c658c7569909378dd3bfda9d1e8811039478af9dd1083452c7bbb6c4217ff" /tmp/certs.txt \
            || { echo "::error::APK ไม่ได้เซ็นด้วย self-use key"; exit 1; }

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/oss/debug/*.apk | head -1)
          out="connectbot-oss-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          gh release create "${GITHUB_REF_NAME}" "$out" \
            --title "ConnectBot fork ${GITHUB_REF_NAME}" \
            --generate-notes
