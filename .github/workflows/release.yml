name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed OSS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with termlib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 cmake;3.22.1'

      - name: Build + sign APK (self-use key)
        uses: ManonWorkingArea/ci-android@v1
        with:
          gradle-command: ./gradlew :app:assembleOssDebug
          apk-path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/oss/debug/*.apk | head -1)
          out="connectbot-oss-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          gh release create "${GITHUB_REF_NAME}" "$out" \
            --title "ConnectBot fork ${GITHUB_REF_NAME}" \
            --generate-notes
